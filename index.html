<!DOCTYPE html>
<html>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet" type="text/css" />
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<head>
  <title>Markov Chain Visualizer</title>
</head>
<body>
  <h1>Markov Chain Visualizer</h1>
  <button onclick="make_matrix_input()">Make dimensions</button>
  <label id="matrixSize" for="number">How many nodes?</label>
  <input type="number" id="number" value="2" step="1" max = "10" min = "2">
  <div id="matrixContainer">
  </div>
  <div class="slidecontainer">
    <label>Speed of Transition</label>
    <input type="range" min="1" max="20" value="10" class="slider" id="speed_slider">
  </div>
  <div id="network" style="width: 600px; height: 400px; border: 1px solid lightgray; margin-top: 20px;"></div>
  <h3 id="matrix_error"></h3>
</body>
</html>
